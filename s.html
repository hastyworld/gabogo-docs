<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>가보고 — 현장 숏폼</title>
<meta property="og:title" content="가보고 — 지금 그곳의 현장 숏폼" />
<meta property="og:description" content="검색하면 과거가 나오고, 가보고를 열면 지금이 나옵니다." />
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    max-width: 760px; margin: 0 auto; padding: 28px 20px 80px; color: #1a1a1a; line-height: 1.7; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .date { color: #888; font-size: 14px; }
  .nav { font-size: 14px; margin-bottom: 8px; }
  .nav a { color: #b07d00; text-decoration: none; }
  .card { border: 1px solid #eee; border-radius: 12px; padding: 20px 18px; margin: 20px 0;
    background: #fffdf7; text-align: center; }
  .open { display: inline-block; background: #F2A900; color: #3D2B00; font-weight: 700;
    text-decoration: none; border-radius: 999px; padding: 14px 32px; font-size: 16px; }
  .open:hover { background: #e09b00; }
  .hint { color: #888; font-size: 13px; margin-top: 14px; }
  .soon { border-top: 1px solid #eee; margin-top: 28px; padding-top: 18px;
    color: #888; font-size: 14px; }
  .idline { color: #bbb; font-size: 12px; margin-top: 10px; word-break: break-all; }
</style>
</head>
<body>
<p class="nav"><a href="./index.html">가보고</a></p>
<h1>현장 숏폼</h1>
<p class="date">지금 그곳의 모습을 담은 30초 영상입니다.</p>

<div class="card">
  <p><b>가보고 앱에서 이 숏폼을 볼 수 있어요.</b></p>
  <p><a class="open" id="openApp" href="#">앱에서 열기</a></p>
  <p class="hint">버튼을 눌러도 열리지 않으면 앱이 설치되지 않은 것입니다.</p>
  <p class="idline" id="idLine"></p>
</div>

<p class="soon">
  가보고는 <b>정식 출시를 준비 중</b>입니다. 스토어 공개 후 이곳에 설치 링크가 올라옵니다.
</p>

<!--
  스토어 링크 — 정식 공개 후 아래 주석을 풀어 .card 안에 넣으면 된다.
  현재는 안드로이드가 비공개 테스트, iOS가 심사 중이라 두 URL 모두 외부에 404다.

  <a href="https://play.google.com/store/apps/details?id=com.hastyworld.gabogo">Google Play</a>
  <a href="https://apps.apple.com/app/id6799131366">App Store</a>
-->

<script>
  // 공유 링크의 id를 앱 딥링크로 넘긴다.
  // 자동 리다이렉트는 하지 않는다 — 앱이 없는 기기에서 브라우저가 오류 대화상자를 띄우기 때문에,
  // 사용자가 직접 버튼을 누르게 둔다.
  (function () {
    var id = new URLSearchParams(location.search).get('id');
    var btn = document.getElementById('openApp');
    if (id) {
      btn.href = 'nowhere://shortform/' + encodeURIComponent(id);
      document.getElementById('idLine').textContent = '숏폼 ID: ' + id;
    } else {
      btn.href = 'nowhere://';
    }
  })();
</script>
</body>
</html>
